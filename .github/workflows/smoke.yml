name: Verify published FIORITURA Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test public HTTPS pages
        run: |
          set -euxo pipefail
          BASE="https://culturedigitali.github.io/fioritura-demo-sanremo"
          # Pages deployment is independent of this workflow; wait for the new HTML.
          ready=0
          for attempt in $(seq 1 18); do
            if curl -fLsS --max-time 15 "$BASE/?verify=$GITHUB_SHA" -o /tmp/home.html &&
               curl -fLsS --max-time 15 "$BASE/giardino-3d.html?verify=$GITHUB_SHA" -o /tmp/legacy.html &&
               grep -q 'hero-riviera' /tmp/home.html &&
               grep -qi 'http-equiv="refresh"' /tmp/legacy.html &&
               ! grep -qi 'three\|importmap\|garden3dViewport' /tmp/legacy.html; then
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" -eq 1
          curl -fLsS --max-time 20 "$BASE/giardino.html?verify=$GITHUB_SHA" -o /tmp/garden.html
          grep -q 'gardenCanvas' /tmp/garden.html
          ! grep -q 'href="./giardino-3d.html"' /tmp/home.html /tmp/garden.html
          curl -fLsS --max-time 20 "$BASE/js/garden-data.js?verify=$GITHUB_SHA" -o /tmp/data.js
          grep -q 'normalizeLocalFlower' /tmp/data.js
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/admin.html")" = "404"
          echo "PUBLIC HTTPS VERIFIED: $BASE/giardino.html"
