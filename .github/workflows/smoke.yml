name: Verify published FIORITURA Pages
on:
  push:
    branches: [main]
    paths: [".github/workflows/smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test public HTTPS pages
        run: |
          set -euxo pipefail
          BASE="https://culturedigitali.github.io/fioritura-demo-sanremo"
          curl -fLsS --retry 12 --retry-delay 8 --retry-all-errors --max-time 15 "$BASE/" -o /tmp/home.html
          grep -qi 'fioritura' /tmp/home.html
          curl -fLsS --retry 8 --retry-delay 6 --retry-all-errors --max-time 15 "$BASE/giardino-3d.html" -o /tmp/garden.html
          grep -qi 'garden3dViewport' /tmp/garden.html
          curl -fLsS --retry 8 --retry-delay 6 --retry-all-errors --max-time 15 "$BASE/js/garden-3d.js" -o /tmp/garden.js
          test "$(wc -c < /tmp/garden.js)" -gt 20000
          echo "PUBLIC HTTPS VERIFIED: $BASE/giardino-3d.html"
